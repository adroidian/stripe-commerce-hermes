name: stripe-commerce
version: 0.2.0
description: Restricted-key Stripe catalog tools with bound offline previews, native Telegram/Discord gateway-only writes with one-operation human consent, and read-only subscription state.
author: stripe-commerce contributors
license: Apache-2.0
requires_hermes: ">=0.21.0"
provides_tools:
  - stripe_whoami
  - stripe_list_products
  - stripe_create_product
  - stripe_archive_product
  - stripe_list_prices
  - stripe_create_price
  - stripe_deactivate_price
  - stripe_create_payment_link
  - stripe_list_payment_links
  - stripe_deactivate_payment_link
  - stripe_list_subscriptions
  - stripe_get_subscription
  - stripe_portal_config
provides_hooks: []
capabilities: []
python_dependencies: []
requires_env:
  - STRIPE_API_KEY
config_schema:
  stripe_api_key:
    type: string
    description: Documentation only. Set STRIPE_API_KEY privately for the active Hermes profile to a restricted rk_test_ or rk_live_ key. Credentials resolve through agent.secret_scope.get_secret when Hermes is present; config values are never used. Resolver errors fail closed. Unrestricted sk_ keys are rejected at registration and every call. Never paste keys in chat.
